AWSTemplateFormatVersion: '2010-09-09'

Description: >
  AWS Networking Lab recreated with CloudFormation.

Resources:

  LabVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.10.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: lab-vpc